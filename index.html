<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronometer</title>
    <!-- Css -->
    <link rel="stylesheet" href="style.css" />
    <!-- Js -->
    <script src="./main.js" defer></script>
  </head>

  <body>
    <div class="wrapper">
      <main class="container">
        <!-- Heading -->
        <h1>Chronometer</h1>

        <!-- Durations; -->
        <div class="durations-wrapper">
          <time id="seconds">00</time>
          :
          <time id="milli-seconds">00</time>
        </div>

        <!-- Buttons -->
        <footer class="btn-wrapper">
          <button id="button-start">Start</button>
          <button id="button-pause">Pause</button>
          <button id="button-restart">Restart</button>
        </footer>
      </main>
    </div>
  </body>
</html>
