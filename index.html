<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronometer</title>
  </head>

  <body>
    <div class="wrapper">
      <div class="container">
        <!-- Heading -->
        <h1>Chronometer</h1>

        <!-- Durations; -->
        <p>
          <span id="seconds">00</span>
          :
          <span id="milli-seconds">00</span>
        </p>

        <!-- Buttons -->
        <div class="btn-wrapper">
          <button id="button-start">Start</button>
          <button id="button-pause">Pause</button>
          <button id="button-restart">Restart</button>
        </div>
      </div>
    </div>
  </body>
</html>
